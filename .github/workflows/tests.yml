name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: pynem      # the package lives in the pynem/ subdirectory

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pynem (with test deps)
        run: pip install -e ".[dev]"
      - name: Install Numba (best-effort; pure-Python fallback otherwise)
        run: pip install "numba>=0.57" || echo "numba unavailable for this Python; testing the pure-Python fallback"
      - name: Run test suite
        run: python -m pytest -q
        # PPanGGOLiN tests self-skip when the submodule/package is absent.
