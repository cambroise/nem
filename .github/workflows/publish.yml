# Build and publish pynem to PyPI on a published GitHub Release, using PyPI
# Trusted Publishing (OIDC) — no API token needed.
#
# ONE-TIME SETUP (on PyPI, before the first release):
#   PyPI -> your account -> Publishing -> add a "pending publisher":
#     PyPI project name : pynem
#     Owner             : cambroise
#     Repository        : nem
#     Workflow name     : publish.yml
#     Environment       : pypi
# Until that is configured, the publish step fails harmlessly; the build +
# `twine check` steps still run and validate the distribution.
#
# Recommended: do a TestPyPI dry-run before the first real upload.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}      # manual dry-run of build + twine check

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # mandatory for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: pynem
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI (Trusted Publishing)
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pynem/dist/
