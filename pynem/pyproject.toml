[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pynem"
dynamic = ["version"]
description = "Neighborhood EM (NEM): spatial clustering on graphs with a hidden Markov random field"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christophe Ambroise", email = "christophe.ambroise@univ-evry.fr" },
]
keywords = [
    "clustering",
    "expectation-maximization",
    "hidden Markov random field",
    "spatial clustering",
    "Bernoulli mixture",
    "pangenome",
    "PPanGGOLiN",
    "neighborhood EM",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "networkx>=2.8",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]                    # plotting (pynem.viz); optional
fast = ["numba>=0.57"]                       # JIT of the sequential E-step; pure-Python fallback otherwise
dev = ["pytest>=7.0", "ruff>=0.6", "matplotlib>=3.5"]  # tests exercise pynem.viz
profile = [ "pyinstrument", "flameprof", "numba"] # perf profiling

[project.urls]
Homepage = "https://github.com/cambroise/nem"
Documentation = "https://pynem.readthedocs.io"
Repository = "https://github.com/cambroise/nem"
Issues = "https://github.com/cambroise/nem/issues"

[tool.setuptools.dynamic]
version = { attr = "pynem.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting. Keep it focused; widen later.
select = ["E", "F", "W", "I"]
