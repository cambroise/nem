site_name: pynem
site_description: Neighborhood EM for spatial clustering on graphs
repo_url: https://github.com/cambroise/nem
repo_name: cambroise/nem
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - API reference: api.md
