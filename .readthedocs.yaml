# Read the Docs configuration. Builds the MkDocs site in pynem/.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: pynem/mkdocs.yml

python:
  install:
    - method: pip
      path: pynem          # install the package so mkdocstrings can import it
    - requirements: pynem/docs/requirements.txt
